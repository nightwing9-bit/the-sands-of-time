name: ci

# Fast gate for pull requests and pushes to main: restore, compile, typed JS checks,
# architecture boundary checks and cheap unit tests (job `dotnet`).
# Real-service tests (Category=Integration: Testcontainers PostgreSQL 18.6 / Redis 7.4) run in the separate,
# bounded `integration` job. Browser suites run in the bounded `e2e` job: the fast stubbed Playwright suites and the Spec 04
# real-backend suite (real Hosts.Api composition, real Timeline engine, PostgreSQL in Docker; no mocked /timeline answers).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dotnet:
    name: dotnet restore/build/test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TheSandsOfTime.slnx

      - name: Build (warnings are errors)
        run: dotnet build TheSandsOfTime.slnx --configuration Release --no-restore -warnaserror

      # Compiled-assembly boundary rules (NetArchTest).
      - name: Architecture boundary tests
        run: dotnet test tests/Architecture/Architecture.Tests.csproj --configuration Release --no-build

      # Remaining cheap unit tests. Integration and E2E tests must carry these traits to stay out of the fast job.
      - name: Cheap unit tests
        run: dotnet test TheSandsOfTime.slnx --configuration Release --no-build --filter "Category!=Integration&Category!=E2E&Category!=MlSsaX64&Category!=OfflineTraining"
      # SSA tests are excluded above on purpose (they need MKL/OpenMP on Linux x64 and must never be skipped silently):
      # the ml-platform-x64 job below runs them and fails unless the expected probe tests executed and passed.

  ml-platform-x64:
    name: ML.NET platform probe (Linux x64 FastTree + SSA)
    # Authoritative SSA gate (Spec 08 R08.13): a native GitHub-hosted Ubuntu x86_64 runner, no emulation.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Runner is Linux x86_64
        run: test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64 && uname -sm && cat /etc/os-release && dotnet --info
      # Microsoft.ML.Mkl.Redist ships libMklImports.so but not its OpenMP dependency libiomp5.so; libomp-dev provides that name.
      - name: Install OpenMP runtime for MKL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libomp-dev
      - name: FastTree + DetectSpikeBySsa + ForecastBySsa fit/save/load/predict
        run: bash scripts/checks/ml-platform-probe.sh --ci
      - name: Build the published Linux AMD64 Worker
        run: docker build --platform linux/amd64 -f deploy/docker/Worker.Dockerfile -t sands-worker-ml:ci .
      - name: Run SSA and pinned FastTree in the published Worker
        shell: bash
        run: |
          set -o pipefail
          image=sands-worker-ml:ci
          image_id=$(docker image inspect --format '{{.Id}}' "$image")
          {
            printf 'image=%s\nimage_id=%s\n' "$image" "$image_id"
            docker run --rm --network none --platform linux/amd64 --entrypoint sh "$image" \
              -ec 'cat /etc/os-release; uname -m; getconf GNU_LIBC_VERSION; dotnet --list-runtimes'
          } | tee TestResults/ml-platform/worker-image.txt
          rc=0
          docker run --rm --network none --platform linux/amd64 -e ML_RUNTIME_IMAGE_ID="$image_id" \
            "$image" --ml-runtime-selftest | tee TestResults/ml-platform/worker-runtime.json || rc=$?
          printf 'selftest_exit=%s\n' "$rc" | tee -a TestResults/ml-platform/worker-image.txt
          test "$rc" -eq 0
          jq -e '.Result == "PASS" and .ProcessArchitecture == "X64" and .Spike.Executed and .Forecast.Executed
            and .SaveLoad and .PredictionValid and .FastTree == "PASS"' TestResults/ml-platform/worker-runtime.json
      - name: Verify published Worker startup and dependency health
        timeout-minutes: 8
        shell: bash
        run: |
          exec > >(tee TestResults/ml-platform/worker-health.txt) 2>&1
          umask 077
          smoke_dir=$(mktemp -d)
          project="r1-worker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          compose=(docker compose --project-name "$project" --env-file "$smoke_dir/fixture.env"
            -f deploy/compose/docker-compose.yml -f "$smoke_dir/worker-image.yml")
          trap '"${compose[@]}" down --volumes --remove-orphans; rm -rf "$smoke_dir"' EXIT
          {
            printf 'POSTGRES_DB=r1_%s_%s\nPOSTGRES_USER=postgres\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            for variable in POSTGRES_PASSWORD REDIS_PASSWORD API_DB_PASSWORD REALTIME_DB_PASSWORD WORKER_DB_PASSWORD \
              API_LEDGER_DB_PASSWORD REALTIME_LEDGER_DB_PASSWORD WORKER_LEDGER_DB_PASSWORD IDENTITY_MASTER_SECRET; do
              secret=$(openssl rand -hex 32)
              printf '%s=%s\n' "$variable" "$secret"
            done
          } > "$smoke_dir/fixture.env"
          printf 'services:\n  worker:\n    image: sands-worker-ml:ci\n' > "$smoke_dir/worker-image.yml"

          "${compose[@]}" up --detach --no-build --wait --wait-timeout 120 worker
          worker=$("${compose[@]}" ps --quiet worker)
          test "$(docker inspect --format '{{.Image}}' "$worker")" = "$(docker image inspect --format '{{.Id}}' sands-worker-ml:ci)"
          test "$(docker inspect --format '{{.Config.User}}' "$worker")" = app
          test "$(docker exec "$worker" id -un)" = app
          test "$(docker exec "$worker" id -u)" -gt 0
          test "$(docker inspect --format '{{.State.Health.Status}}' "$worker")" = healthy
          docker exec "$worker" sh -ec 'wget -qO- http://127.0.0.1:8080/health/live >/dev/null'
          printf 'user=app\ncompose_health=healthy\nliveness=200\n'

          readiness_status() {
            docker exec "$worker" sh -c '
              wget --server-response --output-document=/dev/null --timeout=8 --tries=1 http://127.0.0.1:8080/health/ready 2>&1 |
                awk "\$1 ~ /^HTTP\\// { print \$2; exit }"
            '
          }
          wait_for_readiness() {
            for attempt in {1..12}; do
              if [ "$(readiness_status)" = "$1" ]; then
                return 0
              fi
              sleep 2
            done
            printf 'Worker did not report readiness %s\n' "$1" >&2
            return 1
          }
          wait_for_readiness 200
          printf 'readiness_with_dependencies=200\n'
          "${compose[@]}" stop redis
          wait_for_readiness 503
          docker exec "$worker" sh -ec 'wget -qO- http://127.0.0.1:8080/health/live >/dev/null'
          test "$(docker inspect --format '{{.State.Running}} {{.RestartCount}}' "$worker")" = 'true 0'
          docker logs "$worker" 2>&1 | grep -F 'Application started' >/dev/null
          printf 'readiness_without_redis=503\nliveness_without_redis=200\nworker_restarts=0\n'
          "${compose[@]}" stop worker
          test "$(docker inspect --format '{{.State.ExitCode}}' "$worker")" -eq 0
          printf 'worker_stop_exit=0\n'
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ml-platform-x64-evidence
          path: TestResults/ml-platform
          retention-days: 14

  integration:
    name: dotnet integration (Testcontainers)
    runs-on: ubuntu-24.04
    # Docker is preinstalled on GitHub-hosted Ubuntu runners; Testcontainers starts PostgreSQL/Redis per fixture.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Runner is Linux x86_64
        run: test "$(uname -s)" = Linux && test "$(uname -m)" = x86_64 && uname -sm && dotnet --info
      - name: Pull service images
        timeout-minutes: 5
        run: |
          docker pull postgres:18.6-alpine3.24
          docker pull redis:7.4-alpine
      - name: Restore
        run: dotnet restore TheSandsOfTime.slnx
      - name: Build (warnings are errors)
        id: integration-build
        run: dotnet build TheSandsOfTime.slnx --configuration Release --no-restore -warnaserror
      # The whole tests/Integration project, unfiltered, so no identity/MFA, hub authorization/revocation,
      # outbox/inbox or deployment-guard test can be skipped by a missing trait. A hung test is dumped and killed.
      - name: Integration project (identity, realtime, outbox, deployment guard)
        timeout-minutes: 15
        run: >-
          dotnet test tests/Integration/Integration.Tests.csproj --configuration Release --no-build
          --logger "console;verbosity=normal" --logger "trx"
          --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory TestResults/integration
      # Timeline PostgreSQL suites (Spec 02) that the fast job excludes.
      - name: Marrow real-PostgreSQL tests
        timeout-minutes: 10
        run: >-
          dotnet test tests/Marrow/Marrow.Tests.csproj --configuration Release --no-build
          --filter "Category=Integration"
          --logger "console;verbosity=normal" --logger "trx"
          --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory TestResults/integration
      - name: Upload integration results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: integration-test-results
          path: TestResults/integration
          retention-days: 7
      - name: Revenant real-PostgreSQL tests
        id: revenant-integration
        if: ${{ !cancelled() && steps.integration-build.outcome == 'success' }}
        timeout-minutes: 15
        run: >-
          dotnet test tests/Revenant/Revenant.Tests.csproj --configuration Release --no-build
          --filter "Category=Integration"
          --logger "console;verbosity=normal" --logger "trx;LogFileName=revenant.trx"
          --blame-hang-timeout 5m --blame-hang-dump-type mini
          --results-directory TestResults/revenant-integration
      - name: Require executed Revenant integration and recovery coverage
        if: ${{ !cancelled() && steps.revenant-integration.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import xml.etree.ElementTree as ET

          report = ET.parse("TestResults/revenant-integration/revenant.trx")
          counters = report.find(".//{*}Counters").attrib
          results = report.findall(".//{*}UnitTestResult")
          counts = {key: int(counters[key]) for key in ("total", "executed", "passed")}
          print(counts, flush=True)
          if not results or any(value != len(results) for value in counts.values()):
              raise SystemExit("Expected every discovered integration result to execute and pass")

          definitions = {
              test.attrib["id"]: test.find("{*}TestMethod").attrib
              for test in report.findall(".//{*}TestDefinitions/{*}UnitTest")
          }
          passed = collections.defaultdict(set)
          for result in results:
              if result.attrib["outcome"] != "Passed":
                  raise SystemExit(f"Unexpected result: {result.attrib['testName']}")
              method = definitions[result.attrib["testId"]]
              key = (method["className"].rsplit(".", 1)[-1], method["name"])
              passed[key].add(result.attrib["testName"])

          required = {
              ("ModelInputAdmissionTests", "V3_checks_the_inclusive_amount_bound_before_effects_and_keeps_intake_idempotent"): 1,
              ("ModelInputAdmissionTests", "Incompatible_queue_heads_leave_no_effects_and_do_not_starve_other_runs"): 1,
              ("ModelAwareScreeningTests", "A_learned_score_holds_a_base_clear_payment_in_a_live_V3_run_that_then_settles_after_review_and_verifies_after_crash_and_cold_replay"): 1,
              ("ModelAwareScreeningTests", "Unavailable_models_fail_closed_while_the_worker_screens_V2_and_recovers"): 3,
              ("V4SimulationPostgresTests", "Boundary_blocking_retry_and_journal_digest_survive_a_fresh_dispatcher"): 1,
              ("V4SimulationPostgresTests", "Competing_dispatchers_share_one_boundary_while_another_run_advances"): 1,
              ("V4SimulationPostgresTests", "Failed_commits_and_lost_acknowledgments_do_not_leave_partial_progress"): 1,
              ("V4SimulationPostgresTests", "Tenant_roles_and_constraints_reject_inconsistent_direct_writes"): 1,
              ("V4SimulationPostgresTests", "Upgrade_preserves_old_rows_and_produces_the_same_V4_bytes_as_a_fresh_schema"): 1,
          }
          for test, minimum in required.items():
              observed = len(passed[test])
              print(f"{'.'.join(test)}: {observed} passed")
              if observed < minimum:
                  raise SystemExit(f"Missing executed recovery cases for {'.'.join(test)}")
          PY
      - name: Upload Revenant integration evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: revenant-integration-evidence
          path: TestResults/revenant-integration/*.trx
          retention-days: 14
  web:
    name: npm ci/typecheck/test/build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      # One Node line for every web job; web/package.json "engines" and web/.npmrc (engine-strict) reject anything older.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install (lockfile only)
        run: npm ci
      - name: Typecheck all workspaces (strict)
        run: npm run typecheck
      # Contract tests: node --test, scripted transport, source hygiene. The live-host tests skip unless CONTRACTS_LIVE_API_ORIGIN is set;
      # the real-host proof is the e2e job.
      - name: Contracts tests
        run: npm test --workspace packages/contracts
      - name: Timeline UI component tests
        run: npm test --workspace packages/timeline-ui
      - name: Build both browser apps
        run: npm run build
      # Reads the bundler's module list for both production builds: one shared scrubber module, no cross-app modules, no test files.
      - name: Bundle import graph
        run: npm run check:bundles
  contracts:
    name: contracts freshness (OpenAPI -> TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies (lockfile only)
        run: npm ci
        working-directory: web
      # Rebuilds Hosts.Api, re-emits OpenAPI and regenerates the TypeScript, then fails with a diff if the committed
      # web/packages/contracts/openapi/hosts-api.json or src/generated/*.ts differ. Fix: run scripts/contracts/generate.sh.
      - name: Generated client output is current
        run: bash scripts/contracts/generate.sh --check
  e2e:
    name: browser e2e (stubbed + real backend)
    runs-on: ubuntu-latest
    # Docker is preinstalled on GitHub-hosted Ubuntu runners; the test host starts PostgreSQL through Testcontainers and ends itself
    # after E2E_BACKEND_MAX_SECONDS (1500 s) even if Playwright's teardown were missed.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/E2E/package-lock.json
      - name: Pull service image
        timeout-minutes: 5
        run: docker pull postgres:18.6-alpine3.24
      - name: Install web dependencies (lockfile only)
        run: npm ci
        working-directory: web
      - name: Install Playwright dependencies (lockfile only)
        run: npm ci
        working-directory: tests/E2E
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: tests/E2E
      # Fast suites: both shells, browser-edge stubs for /meta and /timeline (they say so); keyboard, reduced motion, smoke.
      - name: Playwright stubbed suites
        timeout-minutes: 8
        run: npm run test:stubbed
        working-directory: tests/E2E
      # Spec 04 exit gate: no page.route. Builds and starts tests/E2E/backend (real Hosts.Api + Timeline engine + PostgreSQL), both
      # Vite shells proxied to it, then drives seek / fork / typed failures / stale seek / lost-fork-retry in Chromium for both apps.
      - name: Playwright real-backend suite
        timeout-minutes: 10
        run: npm run test:real
        working-directory: tests/E2E
      # Spec 05 task 5.4: Friday Ring click path (start, scrub to 09:00, policy v8, fork, compare) against the same real-backend host
      # with the real Revenant finance engine; every displayed value is compared with the API response and PostgreSQL-stored hashes.
      - name: Playwright Revenant slice suite
        timeout-minutes: 10
        run: npm run test:revenant
        working-directory: tests/E2E
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-test-results
          path: |
            tests/E2E/test-results
          retention-days: 7
  scripts:
    name: check scripts lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Syntax-check and lint check scripts
        run: |
          for f in scripts/checks/*.sh scripts/contracts/*.sh; do bash -n "$f"; done
          shellcheck -x scripts/checks/*.sh scripts/contracts/*.sh
      # One-Realtime-instance invariant: fails if the resolved Compose model scales Realtime beyond one replica.
      - name: Realtime single-replica guard
        run: bash scripts/checks/realtime-scale-guard.sh
