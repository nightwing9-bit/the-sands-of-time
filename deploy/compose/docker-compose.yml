# Local stack: Postgres, Redis, one-shot migrate job, then the three hosts.
# Run from the repository root (needs a populated .env, see .env.example; there are no secret defaults):
#   docker compose --env-file .env -f deploy/compose/docker-compose.yml up --build
# Start order: postgres+redis healthy -> migrate exits 0 -> api/realtime/worker start.
# If `migrate` fails, the hosts never start. Hosts never run migrations themselves.
name: sands-of-time

# Hosts never use the POSTGRES_USER superuser: each connects with its own least-privilege login, which the
# migrate job provisions (scripts/db/migrate.sh): sands_api and sands_realtime hold marrow_identity_runtime only,
# sands_worker holds no schema role yet. Pooled Npgsql connections (bounded pool, 5 s pool/connect wait, 15 s
# command timeout) are set per host below.
x-host-environment: &host-environment
  ASPNETCORE_ENVIRONMENT: Production
  # Redis is a transport/cache only, never the source of truth.
  ConnectionStrings__Redis: "redis:6379,password=${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}"

x-host-depends-on: &host-depends-on
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # Redis never holds authoritative state, but outbox entries already confirmed as published live only in the
    # stream until consumers acknowledge them, so the append-only file (fsync per write) keeps them across a restart.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly yes --appendfsync always"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One-shot migration executor. The same script is the manual/CI command:
  #   docker compose --env-file .env -f deploy/compose/docker-compose.yml run --rm migrate
  migrate:
    image: postgres:18.6-alpine3.24
    entrypoint: ["sh", "/scripts/db/migrate.sh"]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Passwords of the per-host runtime logins the executor provisions after migrating.
      API_DB_PASSWORD: ${API_DB_PASSWORD:?set API_DB_PASSWORD in .env}
      REALTIME_DB_PASSWORD: ${REALTIME_DB_PASSWORD:?set REALTIME_DB_PASSWORD in .env}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env}
    volumes:
      - ../../scripts/db:/scripts/db:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Api.Dockerfile
    environment:
      <<: *host-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=sands_api;Password=${API_DB_PASSWORD:?set API_DB_PASSWORD in .env};Maximum Pool Size=20;Timeout=5;Command Timeout=15"
      # Master secret for access tokens, guest cookies, CSRF and TOTP-at-rest keys. No default: Production refuses to
      # start without a strong, non-placeholder value (src/Marrow.Infrastructure/Identity/IdentityKeyMaterial.cs).
      Identity__MasterSecret: ${IDENTITY_MASTER_SECRET:?set IDENTITY_MASTER_SECRET in .env}
    depends_on: *host-depends-on
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8080"
    healthcheck: &host-healthcheck
      # Liveness only: stays healthy while Redis/Postgres are down. Use /health/ready for dependencies.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/live >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: "on-failure:5"

  realtime:
    build:
      context: ../..
      dockerfile: deploy/docker/Realtime.Dockerfile
    environment:
      <<: *host-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=sands_realtime;Password=${REALTIME_DB_PASSWORD:?set REALTIME_DB_PASSWORD in .env};Maximum Pool Size=20;Timeout=5;Command Timeout=15"
      # Same secret as the API: the hub validates staff access tokens and guest session cookies the API issued.
      Identity__MasterSecret: ${IDENTITY_MASTER_SECRET:?set IDENTITY_MASTER_SECRET in .env}
    depends_on: *host-depends-on
    # WARNING: keep replicas at 1. Match/room loops are owned by exactly ONE Realtime process.
    # A Redis backplane is transport only and does NOT make a second authoritative replica safe
    # (two match authorities are forbidden). Do not scale this service.
    # Enforced by scripts/checks/realtime-scale-guard.sh (config) and a PostgreSQL advisory lock at startup (runtime);
    # see docs/architecture/07-realtime-room-authority.md.
    deploy:
      replicas: 1
    ports:
      - "127.0.0.1:${REALTIME_HOST_PORT:-8082}:8080"
    healthcheck: *host-healthcheck
    restart: "on-failure:5"

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Worker.Dockerfile
    environment:
      <<: *host-environment
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?set POSTGRES_DB in .env};Username=sands_worker;Password=${WORKER_DB_PASSWORD:?set WORKER_DB_PASSWORD in .env};Maximum Pool Size=20;Timeout=5;Command Timeout=15"
    depends_on: *host-depends-on
    ports:
      - "127.0.0.1:${WORKER_HOST_PORT:-8083}:8080"
    healthcheck: *host-healthcheck
    restart: "on-failure:5"

volumes:
  postgres-data:
  redis-data:
