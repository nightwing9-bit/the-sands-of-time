function showToast(msg){S.toast=msg;clearTimeout(toastTimer);renderToast();toastTimer=setTimeout(()=>{S.toast='';renderToast()},4300)}
function renderToast(){const old=$('toast');if(old)old.remove();if(S.toast){$('frame').insertAdjacentHTML('beforeend',`<div class="toast" id="toast" role="status">${svgIcon('check')} ${S.toast}</div>`)}}
function navigate(n){if(n===7&&!S.ran){S.hasFork=true;S.ran=true;S.playhead=1}S.screen=Math.max(1,Math.min(8,n));S.modalOpen=(S.screen===3);S.playing=false;clearInterval(playTimer);S.auditRow=null;render();}
function activeNav(){return S.screen===1?'tower':S.screen<=3?'held':S.screen===4?'liquidity':S.screen<=7?'rewind':'audit'}
function chrome(){let n=activeNav();return `<header class="masthead"><div class="logo" data-nav="1">${svgIcon('hourglass','brandglass')}<span class="wordmark">Revenant</span></div><nav class="tabtray" aria-label="Main navigation"><button class="navtab ${n==='tower'?'active':''}" data-nav="1">${svgIcon('tower')} Control Tower</button><button class="navtab ${n==='held'?'active':''}" data-nav="2">${svgIcon('layers')} Held Queue <span class="countbadge">${DEMO.cases.filter(c=>c.status==='HELD').length}</span></button><button class="navtab ${n==='liquidity'?'active':''}" data-nav="4">${svgIcon('trend')} Liquidity Fan</button><button class="navtab rewind ${n==='rewind'?'active':''}" data-nav="5">${svgIcon('history')} Rewind</button><button class="navtab ${n==='audit'?'active':''}" data-nav="8">${svgIcon('shield')} Audit</button></nav><div class="mast-right"><span class="synthetic-chip"><i></i>SYNTHETIC DATA</span><span class="clock">09:41:07 <span class="muted">UTC</span></span><button class="rolechip" title="Demonstration role">Analyst ${svgIcon('chev')}</button><button class="btn icn" title="Notifications" onclick="showToast('No new notifications')">${svgIcon('bell','icon-lg')}</button><button class="avatar" data-action="signOut" aria-label="Return to sign-in" title="Return to sign-in">AK</button></div></header><div class="statusstrip"><div class="statusleft"><span>Synthetic data — no real funds</span><span class="pipe"></span><span><i class="live-dot"></i> Feed · Demo</span><span class="pipe"></span><span>Active policy <strong style="color:var(--ink)">v7</strong></span><span class="pipe"></span><span>Last tick 09:41:07 UTC</span></div><div class="demo-nav" aria-label="Eight screen navigation"><span>SCREEN PREVIEW</span><button data-nav="${S.screen===1?8:S.screen-1}" title="Previous screen">${svgIcon('chevl')}</button><strong>${String(S.screen).padStart(2,'0')} / 08</strong><button data-nav="${S.screen===8?1:S.screen+1}" title="Next screen">${svgIcon('chevr')}</button></div></div>`}
function pageHead(eyebrow,lede,right=''){return `<div class="pagehead"><div><div class="t-eyebrow eyebrow-above">${eyebrow}</div><h1 class="t-lede">${lede}</h1></div><div class="meta right-meta">${right}</div></div>`}
function quadTile(label,value,unit,status,context,dark=false,extra=''){return `<div class="quad-tile ${dark?'dark':''} ${extra}"><div class="t-eyebrow">${label}</div><div class="t-figure">${value}<span class="unit"> ${unit}</span></div><div class="delta ${status[0]}">${status[1]}</div><div class="context">${context}</div></div>`}

 if(which==='tower'){return `<div class="quad tile-short">${quadTile('VOLUME TODAY','18.4','M USD',['positive','▲ On pace'],'Across six participant banks',true)}${quadTile('RESERVED FUNDS',totalReserved().toFixed(2),'M USD',['warning','● 7 held instructions'],'From synthetic reserve ledger')}${quadTile('OPEN ALERTS','7','',['warning','● 3 require review'],'Policy / graph evidence')}${quadTile('RELEASE RATE','92.4','%',['positive','▲ Settlement flow'],'Synthetic snapshot',true)}</div>`}

}

function curvePath(vals,xStart,xEnd,yScale){let pts=vals.map((v,i)=>({x:xStart+(xEnd-xStart)*i/(vals.length-1),y:yScale(v)}));return splinePts(pts)}
function splinePts(p){if(!p.length)return'';if(p.length===1)return`M${p[0].x} ${p[0].y}`;let d=`M${p[0].x.toFixed(1)} ${p[0].y.toFixed(1)}`;for(let i=0;i<p.length-1;i++){let a=p[Math.max(0,i-1)],b=p[i],c=p[i+1],e=p[Math.min(p.length-1,i+2)];let c1x=b.x+(c.x-a.x)/6,c1y=b.y+(c.y-a.y)/6,c2x=c.x-(e.x-b.x)/6,c2y=c.y-(e.y-b.y)/6;d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`;}return d}

function historyChart(which){const orig=DEMO.original;let policyFactor=S.policy==='v9'?1.3:1;let alternate=orig.map((v,i)=>i<=Math.round(S.forkPos*18)?v:v+((i-Math.round(S.forkPos*18))*.72+(Math.sin(i*.9)-Math.sin(Math.round(S.forkPos*18)*.9))*.22)*policyFactor);const min=9,max=36,x0=73,x1=805,baseY=335,y=v=>baseY-(v-min)/(max-min)*293;const p=orig.map((v,i)=>({x:x0+(x1-x0)*i/(orig.length-1),y:y(v)}));let od=splinePts(p),area=`${od} L${x1} ${baseY}L${x0} ${baseY}Z`;const a=alternate.map((v,i)=>({x:p[i].x,y:y(v)}));const forkIdx=Math.round(S.forkPos*18),forkX=p[forkIdx].x,forkY=p[forkIdx].y;let ad=splinePts(a.slice(forkIdx)),areaA=`${ad} L${x1} ${baseY} L${forkX} ${baseY} Z`;let wedge=splinePts(a.slice(forkIdx))+' L'+[...p.slice(forkIdx)].reverse().map(v=>`${v.x.toFixed(1)} ${v.y.toFixed(1)}`).join(' L')+'Z';let originalEnd=p[p.length-1],altEnd=a[a.length-1];let s=`<svg class="chart-svg" viewBox="0 0 1000 422" preserveAspectRatio="none" role="img" aria-label="Original grey net position curve${which==='result'?', alternate red policy curve peeling away from the fork':''}">${svgChartDef()}<defs><linearGradient id="plotBackground" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#EDF6F4"/></linearGradient></defs>${chartGrid(min,max)}<g clip-path="url(#plotClip)"><path d="${area}" fill="url(#greyArea)"/><path d="${od}" transform="translate(0,3)" stroke="#3F8F9A" stroke-width="5" opacity=".14" fill="none"/><path d="${od}" stroke="#3F8F9A" stroke-width="3" stroke-linecap="round" fill="none"/></g>${eventMarkers()}`;

 }

 s+='</svg>';return s}
function fanChart(){

 s+=`<line x1="${xNow}" x2="${xNow}" y1="42" y2="381" stroke="#0F4C5C" stroke-width="1.5"/><rect x="${xNow-25}" y="32" width="50" height="22" rx="4" fill="#0F4C5C"/><text x="${xNow}" y="47" font-size="10" fill="white" font-weight="700" text-anchor="middle">09:41</text><circle cx="${xNow}" cy="${y(actual)}" r="4.6" fill="#0F4C5C" stroke="white" stroke-width="2"/>`;
 s+=`<g fill="#FF6B4A"><path d="M236 360l5-10 5 10z"><title>Observed held instruction</title></path><path d="M312 360l5-10 5 10z"><title>Observed held instruction</title></path></g>`;
 let tagY=Math.min(288,Math.max(64,y(actual)-22));
 s+=`<g><rect x="846" y="${tagY}" width="147" height="44" rx="5" fill="#fff" stroke="#B6D8D6"/><text x="857" y="${tagY+15}" font-size="10" font-weight="700" fill="#4A7B81">ACTUAL AVAILABLE</text><text x="857" y="${tagY+34}" font-size="17" font-weight="700" fill="#0B2530">$${actual.toFixed(2)}M</text></g></svg>`;

 ${S.auditRow!==null?`<div class="s1 audit-detail"><div class="row-flex between"><div class="t-eyebrow">EVENT PROVENANCE · #${DEMO.audit[S.auditRow][0]}</div><button class="btn icn" data-action="closeAuditRow">${svgIcon('close')}</button></div><p class="t-body small" style="margin-top:10px"><strong>${DEMO.audit[S.auditRow][2]}</strong> · ${DEMO.audit[S.auditRow][1]} UTC</p><div class="mono" style="margin-top:10px">PAYMENT REF · ${auditReference[DEMO.audit[S.auditRow][0]]||'NOT APPLICABLE'}</div><div class="mono" style="margin-top:8px">THIS HASH · ${DEMO.audit[S.auditRow][5]}…</div><div class="meta" style="margin-top:13px">${DEMO.audit[S.auditRow][4]} · ${S.verified?'Demo verification passed':'Verification pending'}</div></div>`:''}</main>`;

document.addEventListener('change',ev=>{if(ev.target.id==='policySelect'){S.policy=ev.target.value;render()}if(ev.target.id==='auditSource'){S.auditSource=ev.target.value;$('auditRows').innerHTML=auditRows()}});
let dragging=false;document.addEventListener('pointerdown',e=>{let zone=e.target.closest('#dockSeekZone');if(!zone||e.target.closest('button'))return;dragging=true;zone.setPointerCapture(e.pointerId);const rect=zone.querySelector('.dock-groove').getBoundingClientRect();setPlayhead((e.clientX-rect.left)/rect.width,false)},true);document.addEventListener('pointermove',e=>{if(!dragging)return;let groove=document.querySelector('.dock-groove');if(!groove)return;let r=groove.getBoundingClientRect();setPlayhead((e.clientX-r.left)/r.width,false)},true);document.addEventListener('pointerup',()=>{if(dragging){dragging=false;if(S.screen===5)render()}},true);
document.addEventListener('keydown',e=>{if(e.key==='Tab'&&S.screen===3){const elements=[...document.querySelectorAll('.confirm-modal button:not([disabled]),.confirm-modal textarea')];if(elements.length){const first=elements[0],last=elements[elements.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}if(e.key==='Escape'){if(S.screen===3)navigate(2);else if(S.auditRow!==null){S.auditRow=null;render()}else if(S.screen>=5&&S.screen<=7)navigate(1);return}if(e.target.matches('input,textarea,select'))return;if(e.altKey&&e.key==='ArrowRight'){e.preventDefault();navigate(S.screen===8?1:S.screen+1);return}if(e.altKey&&e.key==='ArrowLeft'){e.preventDefault();navigate(S.screen===1?8:S.screen-1);return}if(S.screen>=5&&S.screen<=7){if(e.key==='ArrowLeft'){e.preventDefault();setPlayhead(S.playhead-(e.shiftKey?1/360:1/18),true)}if(e.key==='ArrowRight'){e.preventDefault();setPlayhead(S.playhead+(e.shiftKey?1/360:1/18),true)}if(e.key==='Home'){e.preventDefault();setPlayhead(0,true)}if(e.key==='End'){e.preventDefault();setPlayhead(1,true)}if(e.key===' '){e.preventDefault();beginPlay()}if(e.key.toLowerCase()==='f'){e.preventDefault();eventAction('forkHere')}if(e.key==='Enter'&&S.hasFork){e.preventDefault();runScenario()}}});
document.addEventListener('pointermove',e=>{if(dragging)return;const chart=e.target.closest('.chart-outer');if(!chart)return;const tt=chart.querySelector('.chart-tooltip');if(!tt||S.viewTable)return;const r=chart.getBoundingClientRect(),fx=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));if(fx<.07||fx>.85){tt.style.display='none';return}const p=Math.min(1,Math.max(0,(fx-.073)/.765));const sample=DEMO.original;const idx=Math.min(sample.length-1,Math.round(p*(sample.length-1)));let value=sample[idx],message='Original history';if(chart.dataset.chart==='fan'){value=selectedLiquidityBank().available*(p>.35?1:1.43-.43*Math.min(1,p/.35));message=p>.35?'Eight-point persistence (illustrative)':'Observed available · fixture'}else if(chart.dataset.chart==='result'&&idx>Math.round(S.forkPos*18)){value+= (idx-Math.round(S.forkPos*18))*.72;message='Executed child · '+S.policy+' (fixture)'}tt.innerHTML='<strong>'+timeFor(p)+' UTC</strong><div>'+message+'</div><div style="font-weight:600;margin-top:2px">$'+Math.max(.1,value).toFixed(2)+'M</div>';tt.style.display='block';tt.style.left=Math.min(r.width-157,Math.max(8,e.clientX-r.left+12))+'px';tt.style.top=Math.max(8,e.clientY-r.top-65)+'px';});document.addEventListener('pointerout',e=>{let c=e.target.closest('.chart-outer');if(c&&!c.contains(e.relatedTarget)){let tt=c.querySelector('.chart-tooltip');if(tt)tt.style.display='none'}});

function demoHTML(base64){return new TextDecoder().decode(Uint8Array.from(atob(base64),c=>c.charCodeAt(0)))}
function showSignIn(){S.playing=false;clearInterval(playTimer);S.screen=1;render();const gate=$('signInGate');gate.hidden=false;gate.srcdoc=demoHTML(SIGN_IN_B64);gate.focus();}
window.addEventListener('message',event=>{const gate=$('signInGate');if(event.source===gate?.contentWindow&&event.data?.type==='revenant:enter-demo'){gate.hidden=true;gate.removeAttribute('srcdoc');navigate(1);}});
function resizeFrame(){const scale=Math.min(1,window.innerWidth/1440,window.innerHeight/900);$('frame').style.transform=`scale(${scale})`;const shell=$('shell');shell.style.height=`${900*scale}px`;shell.style.minHeight=`${900*scale}px`}
window.addEventListener('resize',resizeFrame);render();resizeFrame();$('signInGate').srcdoc=demoHTML(SIGN_IN_B64);
</script></body></html>
